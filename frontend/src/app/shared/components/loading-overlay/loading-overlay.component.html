<div class="fpl-loader-backdrop" role="status" aria-live="polite">
  <div class="fpl-loader-progress"><span></span></div>
  <div class="fpl-loader-center">
    <div class="fpl-loader-rings">
      <span class="ring ring--1"></span>
      <span class="ring ring--2"></span>
      <span class="ring ring--3"></span>
      <div class="fpl-loader-ball">
        <svg width="34" height="34" viewBox="0 0 40 40" class="fpl-ball-spin">
          <circle cx="20" cy="20" r="18" fill="none" stroke="#37003c" stroke-width="1.6"></circle>
          <polygon points="20,12 27,17 24.5,25 15.5,25 13,17" fill="#37003c"></polygon>
          <path d="M20 12V4M27 17l7-3M24.5 25l4 7M15.5 25l-4 7M13 17l-7-3" stroke="#37003c" stroke-width="1.6" stroke-linecap="round"></path>
        </svg>
      </div>
    </div>
    <div class="fpl-loader-title">FPL STATS</div>
    <div class="fpl-loader-message">{{ message }}</div>
    <div class="fpl-loader-dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</div>
