spring.application.name=Fpl Stats

# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/FplStatsApp
spring.datasource.username=FplStatsApp
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=bootstrap,teamPicks,tripleCaptainWeek
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# Async thread pool (tuned for 0.1 CPU / 512 MB)
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=50

# Scheduler thread pool
spring.task.scheduling.pool.size=1

# HikariCP connection pool (default is 10 — too heavy for free tier)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# Lazy init reduces startup time
spring.main.lazy-initialization=true

# Actuator
management.endpoints.web.exposure.include=health,info,caches

# Sync schedules (cron expressions)
fpl.sync.cron.global=0 0 */4 * * *
fpl.sync.cron.player-histories=0 0 5 * * *
fpl.sync.cron.tracked-teams=0 0 */2 * * *

# FPL API
fpl.api.base-url=https://fantasy.premierleague.com/api

# CORS
cors.allowed-origins=https://fpl-stats-frontend.onrender.com,http://localhost:4200

# Logging
logging.level.org.springframework.web.servlet.mvc.method.annotation.ResponseEntityExceptionHandler=DEBUG
